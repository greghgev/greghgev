<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="300" height="210" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif">
<defs>
  <filter id="sh-pilar-ml" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5.5" flood-color="#0f1e32" flood-opacity="0.16"/></filter>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2196F3"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <clipPath id="cl-pilar-ml"><rect x="10" y="10" width="280" height="190" rx="18"/></clipPath>
</defs>
<rect x="10" y="10" width="280" height="190" rx="18" fill="#FFFFFF" stroke="#E1E6EE" stroke-width="1.5" filter="url(#sh-pilar-ml)"/>
<g clip-path="url(#cl-pilar-ml)"><rect x="10" y="10" width="280" height="6" fill="url(#acc)"/></g>
<!-- Center circle -->
<circle cx="150" cy="58" r="20" fill="#EAF4FE" stroke="#CEE3FA" stroke-width="1.5"/>
<!-- Icon: red neuronal (1-2-1) -->
<g>
  <line x1="136" y1="58" x2="150" y2="47" stroke="url(#acc)" stroke-width="1.8"/>
  <line x1="136" y1="58" x2="150" y2="69" stroke="url(#acc)" stroke-width="1.8"/>
  <line x1="150" y1="47" x2="164" y2="58" stroke="url(#acc)" stroke-width="1.8"/>
  <line x1="150" y1="69" x2="164" y2="58" stroke="url(#acc)" stroke-width="1.8"/>
  <circle cx="136" cy="58" r="3.5" fill="url(#acc)"/>
  <circle cx="150" cy="47" r="3.5" fill="url(#acc)"/>
  <circle cx="150" cy="69" r="3.5" fill="url(#acc)"/>
  <circle cx="164" cy="58" r="3.5" fill="url(#acc)"/>
</g>
<!-- Satellite lines -->
<line x1="150" y1="38" x2="150" y2="30" stroke="#B8D4F0" stroke-width="1.5"/>
<line x1="170" y1="58" x2="188" y2="58" stroke="#B8D4F0" stroke-width="1.5"/>
<line x1="150" y1="78" x2="150" y2="86" stroke="#B8D4F0" stroke-width="1.5"/>
<line x1="130" y1="58" x2="112" y2="58" stroke="#B8D4F0" stroke-width="1.5"/>
<!-- PLN pill -->
<rect x="133" y="14" width="34" height="16" rx="5" fill="#EAF4FE" stroke="#CEE3FA" stroke-width="1"/>
<text x="150" y="25.5" font-family="'SFMono-Regular',Consolas,monospace" font-size="9.5" fill="#1565C0" text-anchor="middle">PLN</text>
<!-- Visión pill -->
<rect x="188" y="50" width="50" height="16" rx="5" fill="#EAF4FE" stroke="#CEE3FA" stroke-width="1"/>
<text x="213" y="61.5" font-family="'SFMono-Regular',Consolas,monospace" font-size="9.5" fill="#1565C0" text-anchor="middle">Visión</text>
<!-- RR.NN. pill -->
<rect x="125" y="86" width="50" height="16" rx="5" fill="#EAF4FE" stroke="#CEE3FA" stroke-width="1"/>
<text x="150" y="97.5" font-family="'SFMono-Regular',Consolas,monospace" font-size="9.5" fill="#1565C0" text-anchor="middle">RR.NN.</text>
<!-- No Sup. pill -->
<rect x="60" y="50" width="52" height="16" rx="5" fill="#EAF4FE" stroke="#CEE3FA" stroke-width="1"/>
<text x="86" y="61.5" font-family="'SFMono-Regular',Consolas,monospace" font-size="9.5" fill="#1565C0" text-anchor="middle">No Sup.</text>
<!-- Title -->
<text x="150" y="120" font-size="17" font-weight="700" fill="#1A2733" text-anchor="middle">ML Avanzado</text>
<line x1="118" y1="134" x2="182" y2="134" stroke="url(#acc)" stroke-width="2.4" stroke-linecap="round"/>
<text x="150" y="151" font-size="12.5" fill="#4A5866" text-anchor="middle">PLN, visión, redes y clustering</text>
<text x="150" y="168" font-size="12.5" fill="#4A5866" text-anchor="middle">aplicados con rigor desde el Máster.</text>
</svg>
